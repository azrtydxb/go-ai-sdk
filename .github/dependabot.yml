version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/contrib/otel"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
