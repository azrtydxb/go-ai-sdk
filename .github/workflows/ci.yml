name: CI

# Migrated to the azrtydxb CI standard (azrtydxb/.github/docs/ci-standard.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    uses: azrtydxb/.github/.github/workflows/reusable-go.yml@main
    with:
      tier: unit
      working-directory: .
      race: false
      lint: false

  gate:
    if: always()
    needs: [go]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify
        run: |
          [ "${{ needs.go.result }}" = "success" ] || exit 1
